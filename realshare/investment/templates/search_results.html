<h2>Search Results</h2>
<div class="properties-grid">
    {% for property in results %}
        <div class="property-item">
            <h3>{{ property.title }}</h3>
            <p>{{ property.location }}</p>
            <p>${{ property.price }}</p>
        </div>
    {% empty %}
        <p>No properties found.</p>
    {% endfor %}
</div>
